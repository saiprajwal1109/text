<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>A collection of my memories</p>
    </header>

    <main class="gallery">

        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500" alt="Nature">
            <h2>Beautiful Nature</h2>
            <p>Exploring the beauty of nature.</p>
        </div>

        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=500" alt="Night Sky">
            <h2>Night Sky</h2>
            <p>Enjoying the beautiful night sky.</p>
        </div>

        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500" alt="Mountains">
            <h2>Mountains</h2>
            <p>A peaceful mountain view.</p>
        </div>

    </main>

    <footer>
        <p>Created by Me | 2026</p>
    </footer>

</body>
</html>
